# Écran nice!view (niveau de batterie, profil Bluetooth actif)
CONFIG_ZMK_DISPLAY=y

# Pas de veille profonde : les 74HC595 et l'écran sont alimentés par la broche VCC,
# qui est coupée en veille profonde -> le clavier ne pourrait plus se réveiller.
# Au repos, le clavier consomme quand même très peu.
CONFIG_ZMK_SLEEP=n

# Puissance radio maximale pour une meilleure portée
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
